name: Foundation checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete history for accepted evidence
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: apps/api/go.sum
      - name: Install pinned dependencies
        run: |
          python -m pip install -r api/test-requirements.txt
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run the same foundation entry as local development
        run: make check-foundation NERAE_PYTHON=python
