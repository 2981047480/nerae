# Nerae 任务板（机器可读）
#
# 这是多 Agent 并行开发的唯一任务源。修改前先读 docs/多Agent协作规范.md。
# 字段：
#   id          唯一编号，永不复用
#   title       一句话可交付结果（不是过程）
#   wave        并行波次；同波次任务默认并行执行
#   kind        parallel=可并行；tail=波次收尾（依赖同波次任务，串行）；serial=契约串行链
#   role        contract|platform|backend|mini|admin|design|qa|ops|product
#   scopes      允许写入的路径前缀（相对仓库根）；与同波次其他任务不得重叠
#   depends_on  前置任务 id；必须指向更早波次，或同波次的 tail/serial 任务
#   estimate    S≤1人日，M≈2–3人日，L≈4–5人日；>L 必须拆分
#   deliverables 交付物（可检查的产物）
#   acceptance  验收标准（可执行、可复现）
#   status      todo|claimed|in_progress|review|done|blocked
#
# 波次约定：
#   W0 契约与决策收口（串行，单人持有 api/openapi.yaml）
#   W1 骨架并行（Git/Go/设计tokens/CI）
#   W2 本地基础设施与两端骨架
#   W3 身份与档案
#   W4 教练与服务包 + 教练/计划广场
#   W5 关系、交付、记录（首个完整交付闭环）
#   W6 免费层与 AI 网关
#   W7 饮食与异常筛查
#   W8 审核与运营后台
#   W9 质量门（契约/集成/E2E/视觉/授权）
#   W10 试点上线准备

meta:
  version: 1
  updated: "2026-10-23"
  source_of_truth: docs/开发计划-v1.0.md
  collaboration: docs/多Agent协作规范.md
  waves:
    - {id: 0, name: 契约定稿与仓库基线, mode: mixed, max_parallel: 4}
    - {id: 1, name: 骨架并行, mode: parallel, max_parallel: 4}
    - {id: 2, name: 基础设施与两端骨架, mode: parallel, max_parallel: 3}
    - {id: 3, name: 身份与档案, mode: parallel+tail, max_parallel: 5}
    - {id: 4, name: 教练与广场, mode: parallel+tail, max_parallel: 6}
    - {id: 5, name: 关系交付记录, mode: parallel+tail, max_parallel: 7}
    - {id: 6, name: 免费层与AI, mode: parallel+tail, max_parallel: 6}
    - {id: 7, name: 饮食与异常, mode: parallel+tail, max_parallel: 4}
    - {id: 8, name: 审核与后台, mode: parallel+tail, max_parallel: 4}
    - {id: 9, name: 质量门, mode: parallel, max_parallel: 4}
    - {id: 10, name: 试点准备, mode: parallel, max_parallel: 3}

