components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 仅接受用户issuer/audience=nerae-users、有效且未吊销token。角色选择仅改变界面，不授予教练认证或管理员能力。每次请求校验账号状态与资源归属。
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 独立admin_account主体、issuer/audience=nerae-admin与服务端RBAC；普通用户JWT即使带admin字段也无效。敏感访问需授权工单并审计。
  parameters:
    WorkoutSessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
        maxLength: 20
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: 认证主体+HTTP方法+规范路径内唯一；同键同摘要返回首次结果，同键异摘要409。保留窗口是上线前必须确认的配置（暂定24h），成功响应返回到期时间。
  responses:
    WorkoutReplayCreated:
      description: 已重新验证授权的原创建回执
      headers:
        Idempotency-Replayed:
          required: true
          schema: {type: string, enum: ['true']}
        Idempotency-Key-Expires-At:
          schema: {type: string, format: date-time}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkoutSessionDetail'
    WorkoutReplayOK:
      description: 已重新验证授权的原训练记录回执
      headers:
        Idempotency-Replayed:
          required: true
          schema: {type: string, enum: ['true']}
        Idempotency-Key-Expires-At:
          schema: {type: string, format: date-time}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkoutSessionDetail'
    WorkoutReplayFailure:
      description: 业务错误；仅当 Idempotency-Replayed 为 true 时才是已提交的原错误回执，否则不得推断原操作结果。
      headers:
        Idempotency-Replayed:
          schema: {type: string, enum: ['true']}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthError:
      description: 认证或身份操作失败；不得缓存，不透露其他账号资料。
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: 业务错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未登录或登录失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ExerciseAlternativeSnapshot:
      type: object
      additionalProperties: false
      properties:
        exerciseId:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 20
        version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 128
        cues:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 500
          minItems: 0
          maxItems: 20
      required:
      - exerciseId
      - version
      - name
      - cues
    ExerciseSnapshot:
      type: object
      additionalProperties: false
      properties:
        exerciseId:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 20
        version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 128
        cues:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 500
          minItems: 0
          maxItems: 20
        precautions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 500
          minItems: 0
          maxItems: 20
        alternatives:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseAlternativeSnapshot'
          minItems: 0
          maxItems: 10
      required:
      - exerciseId
      - version
      - name
      - cues
      - precautions
      - alternatives
      description: 创建计划版本时由服务端冻结。不是医学适用性保证；下架不改写旧版本，禁用媒体另按访问策略处理。
    ExerciseCatalogItem:
      type: object
      additionalProperties: false
      properties:
        snapshot:
          $ref: '#/components/schemas/ExerciseSnapshot'
        equipment:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          minItems: 0
          maxItems: 10
        muscleGroups:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          minItems: 0
          maxItems: 10
        status:
          type: string
          enum:
          - active
          - retired
      required:
      - snapshot
      - equipment
      - muscleGroups
      - status
    ExerciseList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseCatalogItem'
          minItems: 0
          maxItems: 50
        nextCursor:
          type: string
          nullable: true
          maxLength: 256
      required:
      - items
      - nextCursor
    Prescription:
      type: object
      additionalProperties: false
      properties:
        exerciseId:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 20
          example: '101'
        sets:
          type: integer
          minimum: 1
          maximum: 100
        repsMin:
          type: integer
          minimum: 1
          maximum: 1000
        repsMax:
          type: integer
          minimum: 1
          maximum: 1000
        weightKg:
          type: number
          minimum: 0
        rpe:
          type: number
          minimum: 1
          maximum: 10
        restSec:
          type: integer
          minimum: 0
          maximum: 3600
        notes:
          type: string
          maxLength: 2000
        exerciseVersion:
          type: integer
          minimum: 1
        exerciseSnapshot:
          $ref: '#/components/schemas/ExerciseSnapshot'
      required:
      - exerciseId
      - sets
      - repsMin
      - exerciseSnapshot
      description: 完整动作读模型；exerciseId必须等于snapshot.exerciseId；正文随planVersion冻结，客户端不需要先有动作库缓存。
    CoachPlanDetail:
      type: object
      additionalProperties: false
      properties:
        plan:
          $ref: '#/components/schemas/PlanDetail'
        editable:
          type: boolean
        editState:
          type: string
          enum:
          - editable
          - relation_inactive
          - grant_required
          - archived
      required:
      - plan
