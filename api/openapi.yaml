openapi: 3.0.3
info:
  title: Nerae API
  version: 1.2.0
  description: 'Nerae A阶段契约修订稿。K01记录合同正在修订，包含对旧组记录字段的不兼容变化；版本号由K01集成时统一确认，尚未发布。尚未实现业务服务器，文档校验不等于运行时授权已通过。

    服务端是身份、资源归属、授权、来源标签、版本和审核结果的唯一权威；客户端不得自行指定可信身份或证据等级。

    ID为字符串，日期时间为UTC ISO8601，日记日期按明确timeZone解释。写入采用乐观版本；412表示过期版本，409表示状态或幂等冲突。

    Idempotency-Key按(认证主体,HTTP方法,规范路径,key)隔离；同键同摘要返回首次结果，同键异摘要409，并发只有一次提交。幂等窗口暂按24小时作为待确认实现默认，最终值在上线前固定并由响应头Idempotency-Key-Expires-At返回；过期按新请求处理；clientEventId和日期唯一约束另行持久防重。

    公开列表仅返回已发布且public内容；link可见性仅经不可猜测shareToken读取，普通数字ID接口不绕过访问控制。未公开资源对无权用户返回404。

    草稿/输出通过结构校验不代表健康安全；风险拒绝不通过模板、问答或模型切换绕过。缺少摄入证据必须返回insufficient_data。模型固定按已选MiMo配置，不自动升级付费模型。

    所有校验与错误码约定见api/README.md，价格、审核比例、医学阈值不作为本契约已验证的事实。'
  contact:
    name: Nerae
  license:
    name: Proprietary - internal contract, not an open-source license
servers:
- url: https://api.nerae.example.com/v1
  description: 生产（示例域名，部署时替换）
- url: https://api-staging.nerae.example.com/v1
  description: 预发
tags:
- name: Auth
  description: 小程序微信登录、App 短信及测试版邮箱登录与本人身份关联
- name: Me
  description: 我的资料、档案、权限
- name: Coach
  description: 教练侧工作台与资料
- name: Plaza
  description: 教练广场与计划广场（公开）
- name: Plans
  description: 我的训练计划
- name: Diet
  description: 饮食计划与打卡
- name: Publish
  description: 发布助手与提交审核
- name: Records
  description: 训练记录与身体数据
- name: Appointments
  description: 预约与成交自报
- name: Relations
  description: 服务关系与数据授权
- name: Reviews
  description: 评价与举报
- name: AI
  description: AI 能力与额度
- name: Notifications
  description: 消息
- name: Admin
  description: 运营后台
security:
- bearerAuth: []
paths:
  /exercises:
    get:
      tags:
      - Plans
      operationId: getExercises
      summary: 搜索可选动作
      description: 只返回可供新计划选择的active动作；缓存键含版本。退休动作仍由历史计划快照显示，不准静默替换。
      x-required-role: authenticated_resource_owner_or_participant
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: q
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 128
  /exercises/{id}:
    get:
      tags:
      - Plans
      operationId: getExercisesId
      summary: 读取动作库版本
      description: 缺version取当前可用版；指定version可读历史说明但不能据此绕过新建时的停用检查。
      x-required-role: authenticated_resource_owner_or_participant
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseCatalogItem'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: version
        in: query
        schema:
          type: integer
          minimum: 1
  /me/training-schedules:
    post:
      tags:
      - Plans
      operationId: postMeTrainingSchedules
      summary: 启用训练安排
      description: 单个学员最多一个当前安排，数据库锁定选择行进行CAS；切换和取消旧待执行项同一事务。
      x-required-role: authenticated_resource_owner_or_participant
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentTrainingSchedule'
          headers:
            Idempotency-Key-Expires-At:
              description: 本次认证主体与路径内幂等记录的保留到期时间；晚于此时不保证响应缓存重放，但资源唯一约束仍防重。
              schema:
                type: string
                format: date-time
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingScheduleCreate'
  /me/training-schedule:
    get:
      tags:
      - Plans
      operationId: getMeTrainingSchedule
      summary: 读取当前训练安排
      description: 没有安排返回state=none和真实selectionVersion，不回退到任意收藏或最近编辑的计划。
      x-required-role: authenticated_resource_owner_or_participant
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentTrainingSchedule'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /me/training-schedules/{id}:
    patch:
      tags:
      - Plans
      operationId: patchMeTrainingSchedulesId
      summary: 暂停恢复或结束安排
      description: 暂停日起未开始项转paused，不计漏练和完成率分母；恢复仅恢复尚未过期项，不自动顺延，已经暂停过去的日期保留。结束取消未来项并递增selectionVersion；不得删除历史。
      x-required-role: authenticated_resource_owner_or_participant
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSchedule'
          headers:
            Idempotency-Key-Expires-At:
              description: 本次认证主体与路径内幂等记录的保留到期时间；晚于此时不保证响应缓存重放，但资源唯一约束仍防重。
              schema:
                type: string
                format: date-time
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingScheduleAction'
  /me/training-schedules/{id}/occurrences:
    get:
      tags:
      - Plans
      operationId: getMeTrainingSchedulesIdOccurrences
      summary: 读取日期与执行事项
      description: 范围含首尾且最多62天，from<=to。游标固定日期区间；不跨主体，不返回任意计划列表代替应执行事项。
      x-required-role: authenticated_resource_owner_or_participant
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingOccurrenceList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: cursor
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
  /me/training-occurrences/{id}:
    patch:
      tags:
      - Plans
      operationId: patchMeTrainingOccurrencesId
      summary: 改期或跳过尚未开始的训练
      description: 仅scheduled或未来paused项；改期不早于安排时区今日，同一安排一天最多一个非取消训练项，冲突409。已开始/完成/漏练项禁止挪日。必须同时比较事项及安排版本。
      x-required-role: authenticated_resource_owner_or_participant
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingOccurrence'
          headers:
            Idempotency-Key-Expires-At:
              description: 本次认证主体与路径内幂等记录的保留到期时间；晚于此时不保证响应缓存重放，但资源唯一约束仍防重。
              schema:
                type: string
                format: date-time
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingOccurrenceAction'
  /me/today-training:
    get:
      tags:
      - Plans
      operationId: getMeTodayTraining
      summary: 读取唯一可解释的今日训练
      description: 日期由服务端按当前安排时区计算；无安排按已保存偏好，未保存则Asia/Shanghai。跨时区旅行不改历史。
      x-required-role: authenticated_resource_owner_or_participant
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayTraining'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /me/training-starts:
    post:
      tags:
      - Plans
      operationId: postMeTrainingStarts
      summary: 一键另存并开始训练
      description: 用于首次开始：登录及18+声明后，校验可见内容，原子另存(模板来源时)、启用安排、建会话。所选日映射date，反推anchorDate，effectiveFrom=date。date须为安排时区当天且所选非rest日。唯一(user,clientEventId)永久防双击/超时重试重复副本；选择已有当前安排相同计划时恢复今日事项/会话，不重复启用；更换计划需明确replaceCurrent。任何一步失败无部分副本。普通日常开始继续使用/me/sessions并传occurrenceId。
      x-required-role: authenticated_resource_owner_or_participant
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingStartResult'
          headers:
            Idempotency-Key-Expires-At:
              description: 本次认证主体与路径内幂等记录的保留到期时间；晚于此时不保证响应缓存重放，但资源唯一约束仍防重。
              schema:
                type: string
                format: date-time
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingStart'
  /relations/{id}/messages:
    get:
      tags:
      - Plans
      operationId: getRelationsIdMessages
      summary: 读取关系内双向文字会话
      description: 与appointment无依赖。双方在有效留存期可读普通历史；结束关系只读。撤权/关系终结后教练不能读取健康正文，包括旧分页缓存和通知摘要。客服访问另需工单审批。
      x-required-role: authenticated_resource_owner_or_participant
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationMessageList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: cursor
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
    post:
      tags:
      - Plans
      operationId: postRelationsIdMessages
      summary: 发送关系内文字消息
      description: 仅active关系双方；普通文字不要求计划/会话/咨询。服务端确定发送主体，结束关系返回409 RELATION_READ_ONLY。消息写入+站内通知outbox原子提交，外部推送失败不丢站内消息。同幂等键只发送一次。
      x-required-role: authenticated_resource_owner_or_participant
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationMessage'
          headers:
            Idempotency-Key-Expires-At:
              description: 本次认证主体与路径内幂等记录的保留到期时间；晚于此时不保证响应缓存重放，但资源唯一约束仍防重。
              schema:
                type: string
                format: date-time
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationMessageCreate'
  /relations/{id}/messages/read:
    post:
      tags:
      - Plans
      operationId: postRelationsIdMessagesRead
      summary: 推进关系会话已读位置
      description: 读取位置单调前移；message须属于本关系且可见。不把订阅推送成功视为已读；重放不增加未读。
      x-required-role: authenticated_resource_owner_or_participant
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationReadResult'
          headers:
            Idempotency-Key-Expires-At:
              description: 本次认证主体与路径内幂等记录的保留到期时间；晚于此时不保证响应缓存重放，但资源唯一约束仍防重。
              schema:
                type: string
                format: date-time
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRead'
  /me/plans/{id}/adjustments:
    post:
      tags:
      - Plans
      operationId: postMePlansIdAdjustments
      summary: 提出模板内调整建议
      description: 只限本人self/template来源计划，不能改教练交付；固定baseVersion，只做现有结构内调整，不从零开处方。敏感采集同意、安全规则及当前额度先检查。建议不修改计划或执行安排；技术失败503，不自动换供应商。
      x-required-role: authenticated_resource_owner_or_participant
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAdjustment'
          headers:
            Idempotency-Key-Expires-At:
              description: 本次认证主体与路径内幂等记录的保留到期时间；晚于此时不保证响应缓存重放，但资源唯一约束仍防重。
              schema:
                type: string
