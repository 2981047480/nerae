            - required: [exerciseId]
            - required: [exerciseName]
        - required: [exerciseId, exerciseName]
        - properties:
            kind:
              type: string
              enum: [weight, perSide]
          anyOf:
          - not:
              required: [weightKg]
          - not:
              required: [reps]
          - required: [seconds]
        - properties:
            kind:
              type: string
              enum: [bodyweight, bodyweightPerSide, breath]
          anyOf:
          - not:
              required: [reps]
          - required: [weightKg]
          - required: [seconds]
        - properties:
            kind:
