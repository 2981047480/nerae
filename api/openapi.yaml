    AuthOpaqueId:
      type: string
      minLength: 22
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
      description: 服务端生成的不可预测标识，不得使用顺序用户 ID。
    AuthSecret:
      type: string
      minLength: 43
      maxLength: 256
      pattern: ^[A-Za-z0-9_-]+$
      description: 服务端生成的高熵一次性凭据；仅经 TLS 请求体传递，不放 URL、日志或推送。
    SmsCode:
      type: string
      pattern: ^[0-9]{6,10}$
      description: 一次性短信验证码；不记录明文，具体长度与生效期由供应商及安全配置核定。
    EmailCode:
      type: string
      pattern: ^[0-9]{6,10}$
      description: 一次性邮箱验证码；不记录明文，不在 HTTP 响应或日志中返回，具体长度与生效期由安全配置核定。
    EmailAddress:
      type: string
      format: email
      minLength: 3
      maxLength: 254
      pattern: '^[!-?A-~]+@[!-?A-~]+$'
      description: 测试版仅支持无空白、无显示名的 ASCII 邮箱地址；服务端还须验证具体语法，不支持时明确提示。域名按大小写不敏感规范化，本地部分按输入精确保留；不删除加号或点号、不推断其他供应商别名。真实地址仅用于必要验证并加密存储，不进入日志。
    DevicePublicJwk:
      type: object
      additionalProperties: false
      required:
      - kty
      - crv
      - x
      - y
      properties:
        kty:
          type: string
          enum:
          - EC
        crv:
          type: string
          enum:
          - P-256
        x:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        y:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
    DeviceProof:
      type: string
      minLength: 32
      maxLength: 4096
      pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
      description: 紧凑格式 ES256 JWS，保护头 alg=ES256、typ=JWT；载荷必须含 aud=nerae-auth-device、purpose（phone_login、email_login、approval_exchange 或 recovery_code）、resourceId、服务端
        nonce、iat、exp 和随机单次 jti。服务端验证签名及所有字段与事务/公钥绑定并防重。私钥应由平台安全存储生成且不可导出；是否支持须逐端验证。
    EmailLoginChallengeRequest:
      type: object
      additionalProperties: false
      required:
