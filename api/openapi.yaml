      properties:
        kind:
          type: string
          enum:
          - plan_version
          - checkin
          - observation
          - self_report
          - allergy_profile
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 20
          example: '101'
        version:
          type: integer
          minimum: 1
        fieldPath:
          type: string
        provenance:
          type: string
          enum:
          - author_claim
          - user_confirmed
          - unconfirmed_ai
          - insufficient
      required:
      - kind
      - id
      - version
      - provenance
    AnomalyReview:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - acknowledged
          - false_positive
          - resolved
        note:
          type: string
          maxLength: 2000
      required:
      - expectedVersion
      - status
    AnomalyList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnomalyFlag'
        nextCursor:
          type: string
          nullable: true
      required:
      - items
      - nextCursor
    CoachAiDraftResponse:
      oneOf:
      - $ref: '#/components/schemas/CoachAiDraftReady'
      - $ref: '#/components/schemas/CoachAiDraftNeedsInput'
      - $ref: '#/components/schemas/CoachAiDraftSafetyBlock'
      discriminator:
        propertyName: state
        mapping:
          ready: '#/components/schemas/CoachAiDraftReady'
          needs_input: '#/components/schemas/CoachAiDraftNeedsInput'
          safety_block: '#/components/schemas/CoachAiDraftSafetyBlock'
      description: ready返回已持久化完整草稿及动作快照，但仍未发布；needs_input/safety_block只写真实ai_run，不创建空plan_version。技术失败返回503
        Error，不冒充业务安全阻断。
    RelationConfirm:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        termsHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        acknowledged:
          type: boolean
          enum:
          - true
      required:
      - expectedVersion
      - termsHash
      - acknowledged
