    RecordingV2Key:
      type: string
      minLength: 8
      maxLength: 64
      description: 稳定键，大小写敏感；同一训练内不得复用。
    RecordingV2Version:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    RecordingV2Mode:
      type: string
      enum: [after_workout, per_set]
    RecordingV2Weight:
      type: string
      pattern: '^[0-9]{1,6}(\.[0-9]{1,2})?$'
      description: 千克十进制文本；字段省略表示未填，字符串 0 是实际填写的零，不等同于未填。
    RecordingV2Create:
      type: object
      additionalProperties: false
      required: [source, date, clientEventId, mode]
      properties:
        source: {type: string, enum: [free]}
        date: {type: string, format: date}
        timeZone: {type: string, minLength: 1, maxLength: 64}
        clientEventId: { $ref: '#/components/schemas/RecordingV2Key' }
        mode: { $ref: '#/components/schemas/RecordingV2Mode' }
    RecordingV2Receipt:
      type: object
      additionalProperties: false
      required: [id, version]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$', maxLength: 20}
        version: { $ref: '#/components/schemas/RecordingV2Version' }
    RecordingV2Side:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {type: string, enum: [unknown, performed, not_performed]}
        weightKg: { $ref: '#/components/schemas/RecordingV2Weight' }
        reps: {type: integer, minimum: 1, maximum: 100}
    RecordingV2Measurement:
      type: object
      additionalProperties: false
      required: [method]
      description: |
        total 是合计重量，pair_each 是每只器械重量（两只），sides 分别存左右；bodyweight 是自重，bodyweight_extra 加额外负重，bodyweight_assisted 减助力，direct 是手填结果。
        缺项时仍保存；服务器校验各方法允许的字段，只按已知且可计算的部分累计。未做的一侧不累计。
      properties:
        method: {type: string, enum: [total, pair_each, sides, bodyweight, bodyweight_extra, bodyweight_assisted, direct]}
        weightKg: { $ref: '#/components/schemas/RecordingV2Weight' }
        reps: {type: integer, minimum: 1, maximum: 100}
        bodyweightKg: { $ref: '#/components/schemas/RecordingV2Weight' }
        adjustmentKg: { $ref: '#/components/schemas/RecordingV2Weight' }
        left: { $ref: '#/components/schemas/RecordingV2Side' }
        right: { $ref: '#/components/schemas/RecordingV2Side' }
    RecordingV2EntryInput:
      type: object
      additionalProperties: false
      required: [exerciseEntryKey, exerciseName]
      description: 目前只接收用户本次输入的自定义名称；动作库身份、冻结版本和计划来源待接入。
      properties:
        exerciseEntryKey: { $ref: '#/components/schemas/RecordingV2Key' }
        exerciseName: {type: string, minLength: 1, maxLength: 60}
    RecordingV2Entry:
      type: object
      additionalProperties: false
      required: [exerciseEntryKey, source, exerciseName]
      properties:
        exerciseEntryKey: { $ref: '#/components/schemas/RecordingV2Key' }
        source: {type: string, enum: [custom]}
        exerciseName: {type: string, minLength: 1, maxLength: 60}
        removedPosition: {type: integer, minimum: 1}
        volume: { $ref: '#/components/schemas/RecordingV2Volume' }
    RecordingV2Volume:
      type: object
      additionalProperties: false
      required: [fullSets, partialSets, excludedSets]
      description: 按当前动作段的活动组和记录口径计算；缺项不算零，移除的组不计入。公斤数字不等同实际测得的受力。
      properties:
        calculatedKg: {type: string, maxLength: 32, pattern: '^[0-9]+(?:\.[0-9]{1,2})?$'}
        fullSets: {type: integer, minimum: 0, maximum: 9007199254740991}
        partialSets: {type: integer, minimum: 0, maximum: 9007199254740991}
        excludedSets: {type: integer, minimum: 0, maximum: 9007199254740991}
    RecordingV2Set:
      type: object
      additionalProperties: false
      required: [recordKey, exerciseEntryKey, setIndex, confirmed, measurement]
      properties:
        recordKey: { $ref: '#/components/schemas/RecordingV2Key' }
        exerciseEntryKey: { $ref: '#/components/schemas/RecordingV2Key' }
        setIndex: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        confirmed: {type: boolean, description: 仅表示逐组记下，不是整场完成的前置条件。}
        rpe: {type: string, pattern: '^(?:[1-9](?:\.[0-9])?|10(?:\.0)?)$'}
        measurement: { $ref: '#/components/schemas/RecordingV2Measurement' }
    RecordingV2RemovedSet:
      type: object
      additionalProperties: false
      required: [set, removedPosition]
      properties:
        set: { $ref: '#/components/schemas/RecordingV2Set' }
        removedPosition: {type: integer, minimum: 1}
    RecordingV2Removal:
      type: object
      additionalProperties: false
      required: [recordKey, removedPosition]
      properties:
        recordKey: { $ref: '#/components/schemas/RecordingV2Key' }
        removedPosition: {type: integer, minimum: 1, maximum: 9007199254740991}
    RecordingV2Batch:
      type: object
      additionalProperties: false
      required: [expectedVersion, exerciseEntryKeys]
      description: |
        sets 是完整替换各自组值的显式变更；未列出的组保持不变。exerciseEntryKeys 包含所有动作段键及其顺序，包括暂时移除的动作。动作段身份和组身份不可静默复用。
        更新、组移除/恢复与动作移除/恢复合计最多 200 项。同一组允许在一批中先恢复、更新再移除，以保留离线最新输入；仅在该组同时提供更新时才可同时移除与恢复。重复键、无效顺序或不相容计量字段不得部分提交。
      properties:
        expectedVersion: { $ref: '#/components/schemas/RecordingV2Version' }
        date: {type: string, format: date, pattern: '^[1-9][0-9]{3}-[0-9]{2}-[0-9]{2}$', description: 训练发生日期；按本记录冻结的时区校验不得晚于当天。}
        mode: { $ref: '#/components/schemas/RecordingV2Mode' }
        addEntries:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/RecordingV2EntryInput' }
        sets:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/RecordingV2Set' }
        removeRecordKeys:
          type: array
          maxItems: 200
          uniqueItems: true
          items: { $ref: '#/components/schemas/RecordingV2Key' }
        removeRecords:
          type: array
          maxItems: 200
          description: 离线顺序移除时携带每组移除时的可见编号；不得与 removeRecordKeys 重复。
          items: { $ref: '#/components/schemas/RecordingV2Removal' }
        restoreRecordKeys:
          type: array
          maxItems: 200
          uniqueItems: true
          items: { $ref: '#/components/schemas/RecordingV2Key' }
        removeEntryKeys:
          type: array
          maxItems: 200
          uniqueItems: true
          items: { $ref: '#/components/schemas/RecordingV2Key' }
        restoreEntryKeys:
          type: array
          maxItems: 200
          uniqueItems: true
          items: { $ref: '#/components/schemas/RecordingV2Key' }
        exerciseEntryKeys:
          type: array
          maxItems: 2000
          uniqueItems: true
          items: { $ref: '#/components/schemas/RecordingV2Key' }
    RecordingV2Finish:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { $ref: '#/components/schemas/RecordingV2Version' }
    RecordingV2ActionVolume:
      type: object
      additionalProperties: false
      required: [exerciseEntryKeys, volume]
      description: 同一动作在本次记录中各活动动作段的累计；不把缺项作为零。
      properties:
        exerciseEntryKeys:
          type: array
          minItems: 1
          maxItems: 2000
          uniqueItems: true
          items: { $ref: '#/components/schemas/RecordingV2Key' }
        volume: { $ref: '#/components/schemas/RecordingV2Volume' }
    RecordingV2Detail:
      type: object
      additionalProperties: false
      required: [id, version, source, date, timeZone, clientEventId, status, mode, createdAt, updatedAt, entries, sets, removedSets]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$', maxLength: 20}
        version: { $ref: '#/components/schemas/RecordingV2Version' }
        source: {type: string, enum: [free]}
        date: {type: string, format: date}
        timeZone: {type: string, minLength: 1, maxLength: 64}
        clientEventId: { $ref: '#/components/schemas/RecordingV2Key' }
        status: {type: string, enum: [in_progress, completed]}
        mode: { $ref: '#/components/schemas/RecordingV2Mode' }
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        recordedAt: {type: string, format: date-time}
        entries:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/RecordingV2Entry' }
        sets:
          type: array
          items: { $ref: '#/components/schemas/RecordingV2Set' }
        removedSets:
          type: array
          items: { $ref: '#/components/schemas/RecordingV2RemovedSet' }
        actionVolumes:
          type: array
          maxItems: 2000
          description: 按本次记录中的同一动作汇总活动段；旧服务可能未提供。
          items: { $ref: '#/components/schemas/RecordingV2ActionVolume' }
    RecordingV2Summary:
      type: object
      additionalProperties: false
      required: [id, version, recordFormat, date, timeZone, status]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$', maxLength: 20}
        version: { $ref: '#/components/schemas/RecordingV2Version' }
        recordFormat: {type: integer, enum: [1, 2]}
        date: {type: string, format: date}
        timeZone: {type: string, minLength: 1, maxLength: 64}
        status: {type: string, enum: [in_progress, completed, skipped]}
    RecordingV2Page:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/RecordingV2Summary' }
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 50}
        total: {type: integer, minimum: 0}
    WorkoutSession:
      type: object
      description: 一份训练记录；date是实际训练日，createdAt/updatedAt/recordedAt是服务端处理时间，不能推断训练开始或各组完成时刻。
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: 创建时冻结的有效IANA时区，用于校验实际训练日；不能随设备变化静默改变。
        status:
          type: string
          enum:
          - in_progress
          - completed
          - skipped
        planId:
          type: string
          nullable: true
        planDayId:
          type: string
          nullable: true
        durationMin:
          type: integer
          nullable: true
          minimum: 0
        rpe:
          type: number
          nullable: true
          minimum: 1
          maximum: 10
        note:
          type: string
          nullable: true
        source:
          type: string
          enum:
          - plan
          - free
        sets:
          type: array
          description: 已确认的实际组；空白计划组不在此列表中。
          items:
            $ref: '#/components/schemas/WorkoutSetRecord'
        version:
          type: integer
          minimum: 1
        planVersion:
          type: integer
          minimum: 1
        occurrenceId:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 20
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: 服务端创建记录的时间，不代表实际训练开始时间。
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: 服务端最近一次实际变更的时间。
        recordedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: 最近一次保存确认的服务端接收时间；不是实际训练完成时间。
      required:
      - id
      - date
      - timeZone
      - status
      - source
      - version
      - createdAt
      - updatedAt
      - recordedAt
      # 排除非法组合，同时保留可由 Go/TS 生成器构造的对象类型。
      not:
        anyOf:
        - properties:
            status:
              type: string
              enum: [completed]
          not:
            properties:
              recordedAt:
                type: string
                format: date-time
        - required: [sets]
          properties:
            status:
              type: string
              enum: [skipped]
            sets:
              type: array
              minItems: 1
    WorkoutSessionDetail:
      description: 可恢复或处理冲突的完整记录，始终包含当前实际组及其动作条目顺序；completed必须至少有一组。exerciseEntryKeys与sets所属条目集合精确一致，sets按动作顺序及各动作内setIndex升序返回；这些跨字段不变量由运行时校验。未确认草稿不是实际组，其单独同步能力不可由此接口推定。
      allOf:
      - $ref: '#/components/schemas/WorkoutSession'
      - type: object
        required: [clientEventId, sets, exerciseEntryKeys]
        properties:
          clientEventId:
            type: string
            minLength: 8
            maxLength: 64
            readOnly: true
            description: 创建记录时的稳定事件标识；仅授权主体可读取，用于跨设备恢复同一记录，不构成凭据。
          sets:
            type: array
            items:
              $ref: '#/components/schemas/WorkoutSetRecord'
          exerciseEntryKeys:
            $ref: '#/components/schemas/WorkoutExerciseEntryOrder'
        not:
          anyOf:
          - properties:
              status:
                type: string
                enum: [completed]
              sets:
                type: array
                maxItems: 0
          - properties:
              sets:
                type: array
                maxItems: 0
              exerciseEntryKeys:
                type: array
                minItems: 1
          - properties:
              sets:
                type: array
                minItems: 1
              exerciseEntryKeys:
                type: array
                maxItems: 0
    WorkoutExerciseEntryOrder:
      type: array
      maxItems: 2000
      uniqueItems: true
      description: 按用户记录顺序排列的全部实际动作条目键；技术上限不是建议训练量，条目内组序号可不连续。
      items:
        type: string
        minLength: 8
        maxLength: 64
    SetRecord:
      type: object
      additionalProperties: false
      description: 已确认的实际组；两种记录模式共享recordKey。kind指明数据的含义，perSide和durationPerSide的数值为每侧值，不自动推断左右分别或合计。秒数由用户手填，不表示计时功能。
      required:
      - setIndex
      - recordKey
      - exerciseEntryKey
      - kind
      properties:
        exerciseId:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 20
          description: 动作库中的动作ID；与自定义exerciseName二选一，必须有权使用。
        exerciseName:
          type: string
          minLength: 1
          maxLength: 60
          pattern: '\S'
          description: 用户在本次会话中自行填写的动作名称；与exerciseId二选一，不创建共享动作库条目。
        exerciseEntryKey:
          type: string
          minLength: 8
          maxLength: 64
          description: 会话内稳定的动作条目键，同一动作的不同编排段使用不同键；大小写敏感。
        resolvedExerciseName:
          type: string
          minLength: 1
          maxLength: 128
          readOnly: true
          description: 服务端冻结的动作显示名称；自定义名称来自本人输入，库动作来自有权访问的对应快照。服务端不得信任客户端提供的值。
        setIndex:
          type: integer
          minimum: 1
        kind:
          type: string
          enum:
          - weight
          - perSide
          - bodyweight
          - bodyweightPerSide
          - duration
          - durationPerSide
          - breath
        weightKg:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 300
          description: 用户实际输入的重量，最多两位小数；weight与perSide必填，其他类型不得携带。服务端按十进制校验精度。
        reps:
          type: integer
          minimum: 1
          maximum: 100
          description: 实际次数或呼吸次数；每侧类型表示每侧的次数。
        seconds:
          type: integer
          minimum: 5
          maximum: 600
          description: 手填的实际秒数；每侧类型表示每侧的秒数。
        rpe:
          type: number
          nullable: true
          minimum: 1
          maximum: 10
          description: 主观评分，最多一位小数；服务端按十进制校验精度。
        completed:
          type: boolean
          enum:
          - true
          description: 此资源仅承载已确认的实际组；空白和未完成组保留在客户端草稿。
        recordKey:
          type: string
